<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sunucu Altband</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 1920px; height: 1080px; }

  .band {
    position: absolute;
    left: 60px;
    bottom: 70px;
    display: flex;
    align-items: center;
    height: 150px;
    border-radius: 24px;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #fff;
    /* banner.png yoksa pembe gradyan görünür */
    background:
      url("banner.png") center / cover no-repeat,
      linear-gradient(100deg, #ffc2d6 0%, #ff4d94 45%, #d4004f 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transform: translateX(-130%);
    opacity: 0;
    transition: transform .8s cubic-bezier(.2,.9,.3,1), opacity .5s ease;
  }
  .band.show { transform: translateX(0); opacity: 1; }

  .logo {
    height: 150px;
    width: 150px;
    object-fit: cover;
    flex: none;
  }

  .text { padding: 0 48px 0 32px; }
  .title {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: .5px;
    text-shadow: 0 2px 10px rgba(120,0,40,.55);
  }
  .sub {
    font-size: 28px;
    font-weight: 500;
    margin-top: 6px;
    text-shadow: 0 2px 8px rgba(120,0,40,.55);
  }

  /* hafif parlama efekti */
  .band::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 30%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg);
  }
  .band.show::after { animation: shine 1.4s ease 0.9s 1; }
  @keyframes shine { to { left: 130%; } }
</style>
</head>
<body>

<div class="band" id="band">
  <img class="logo" src="logo.png" alt="">
  <div class="text">
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>

<script>
  // ====== AYARLAR ======
  const MESAJLAR = [
    { baslik: "Aşk Adası Sunucusu",   alt: "Aramıza katıl 🌴 discord.gg/seninlink" },
    { baslik: "Aşk Adası'na davetlisin", alt: "Yeni insanlarla tanış, eğlenceye katıl 💖" },
  ];
  const BEKLEME_SN = 120;   // iki gösterim arası (saniye)
  const EKRANDA_SN = 9;     // ekranda kalma süresi (saniye)
  // =====================

  const band = document.getElementById("band");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  let i = 0;

  function goster() {
    const m = MESAJLAR[i % MESAJLAR.length];
    i++;
    title.textContent = m.baslik;
    sub.textContent = m.alt;
    band.classList.add("show");
    setTimeout(() => band.classList.remove("show"), EKRANDA_SN * 1000);
  }

  setTimeout(goster, 3000);
  setInterval(goster, (BEKLEME_SN + EKRANDA_SN) * 1000);
</script>
</body>
</html>
